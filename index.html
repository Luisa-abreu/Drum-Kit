<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Drum Kit</title>
</head>

<body>
    <main class="keys">
        <div data-key="65" class="key" style="background-color: #355070;">A <span>
                clap</span>
        </div>
        <div data-key="83" class="key" style="background-color: #515575;">S
            <span>
                hihat</span>
        </div>
        <div data-key="68" class="key" style="background-color: #6D597A;">
            D <span>kick</span>
        </div>
        <div data-key="70" class="key" style="background-color: #915F78;">F <span>
                openhat</span>
        </div>
        <div data-key="71" class="key" style="background-color: #B56576;">G <span>
                boom</span>
        </div>
        <div data-key="72" class="key" style="background-color: #E56B6F;">H <span>
                ride</span>
        </div>
        <div data-key="74" class="key" style="background-color: #E88C7D;">J <span>
                snare</span>
        </div>
        <div data-key="75" class="key" style="background-color: #EAAC8B;">K <span>
                tom</span>
        </div>
    </main>

    <audio data-key="65" src="sounds/clap.wav"></audio>
    <audio data-key="83" src="sounds/hihat.wav"></audio>
    <audio data-key="68" src="sounds/kick.wav"></audio>
    <audio data-key="70" src="sounds/openhat.wav"></audio>
    <audio data-key="71" src="sounds/boom.wav"></audio>
    <audio data-key="72" src="sounds/ride.wav"></audio>
    <audio data-key="74" src="sounds/snare.wav"></audio>
    <audio data-key="75" src="sounds/tom.wav"></audio>

</body>

</html>
